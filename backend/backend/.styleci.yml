###############################################################################
# Dental Healthcare Management System
# StyleCI Configuration
# Laravel 12 / PSR-12 Standard
###############################################################################

preset: laravel


###############################################################################
# PHP Version
###############################################################################

php_version: 8.3


###############################################################################
# Line Ending
###############################################################################

line_ending: lf


###############################################################################
# Indentation
###############################################################################

indentation:
    spaces: 4


###############################################################################
# Rules
###############################################################################

rules:

    array_syntax:
        syntax: short


    binary_operator_spaces:
        default: single_space


    blank_line_after_namespace: true


    blank_line_after_opening_tag: true


    class_attributes_separation:
        elements:
            method: one


    concat_space:
        spacing: one


    declare_strict_types: true


    no_unused_imports: true


    ordered_imports:
        sort_algorithm: alpha


    phpdoc_align: true


    phpdoc_order:
        - param
        - return


    single_quote: true


    trailing_comma_in_multiline:
        elements:
            arrays: true
            arguments: true
            parameters: true


###############################################################################
# Paths
###############################################################################

paths:

    - app/**/*.php

    - config/**/*.php

    - database/**/*.php

    - routes/**/*.php

    - tests/**/*.php


###############################################################################
# Exclude
###############################################################################

exclude:

    - vendor

    - storage

    - bootstrap/cache