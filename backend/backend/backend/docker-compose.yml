###############################################################################
# Dental Healthcare Management System
# Docker Compose Configuration
# Laravel 12 Production Foundation
###############################################################################

services:


  ###########################################################################
  # Laravel Application
  ###########################################################################

  app:

    build:

      context: .

      dockerfile: Dockerfile


    container_name: dental-healthcare-app


    restart: unless-stopped


    working_dir: /var/www/html


    volumes:

      - ./:/var/www/html


      - ./docker/php/php.ini:/usr/local/etc/php/php.ini


      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini


    networks:

      - dental-network


    depends_on:

      - mysql

      - redis



  ###########################################################################
  # Nginx Web Server
  ###########################################################################

  nginx:

    image: nginx:1.27-alpine


    container_name: dental-healthcare-nginx


    restart: unless-stopped


    ports:

      - "${DOCKER_NGINX_PORT:-80}:80"


    volumes:

      - ./:/var/www/html


      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf


    depends_on:

      - app


    networks:

      - dental-network



  ###########################################################################
  # MySQL Database
  ###########################################################################

  mysql:

    image: mysql:8.4


    container_name: dental-healthcare-mysql


    restart: unless-stopped


    environment:

      MYSQL_DATABASE: ${DB_DATABASE}

      MYSQL_USER: ${DB_USERNAME}

      MYSQL_PASSWORD: ${DB_PASSWORD}

      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}


    ports:

      - "${DB_PORT:-3306}:3306"


    volumes:

      - mysql-data:/var/lib/mysql


    networks:

      - dental-network



  ###########################################################################
  # Redis Cache / Queue
  ###########################################################################

  redis:

    image: redis:7-alpine


    container_name: dental-healthcare-redis


    restart: unless-stopped


    ports:

      - "6379:6379"


    volumes:

      - redis-data:/data


    command:

      redis-server --appendonly yes


    networks:

      - dental-network



  ###########################################################################
  # Queue Worker
  ###########################################################################

  queue:

    build:

      context: .

      dockerfile: Dockerfile


    container_name: dental-healthcare-queue


    restart: unless-stopped


    working_dir: /var/www/html


    command:

      php artisan queue:work --sleep=3 --tries=3


    volumes:

      - ./:/var/www/html


    depends_on:

      - app

      - redis


    networks:

      - dental-network



  ###########################################################################
  # Laravel Scheduler
  ###########################################################################

  scheduler:

    build:

      context: .

      dockerfile: Dockerfile


    container_name: dental-healthcare-scheduler


    restart: unless-stopped


    working_dir: /var/www/html


    command:

      sh -c "while true; do php artisan schedule:run; sleep 60; done"


    volumes:

      - ./:/var/www/html


    depends_on:

      - app


    networks:

      - dental-network



###############################################################################
# Networks
###############################################################################

networks:

  dental-network:

    driver: bridge



###############################################################################
# Persistent Storage
###############################################################################

volumes:


  mysql-data:


  redis-data: