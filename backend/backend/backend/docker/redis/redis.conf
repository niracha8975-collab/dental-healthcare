###############################################################################
# Dental Healthcare Management System
# Redis 7 Configuration
# Production Foundation
###############################################################################


###############################################################################
# Network
###############################################################################

bind 0.0.0.0

protected-mode yes

port 6379



###############################################################################
# General
###############################################################################

daemonize no

supervised no


loglevel notice



###############################################################################
# Persistence
###############################################################################

appendonly yes

appendfsync everysec


dir /data



###############################################################################
# Memory Management
###############################################################################

maxmemory 512mb


maxmemory-policy allkeys-lru



###############################################################################
# Connection Management
###############################################################################

timeout 300


tcp-keepalive 60



###############################################################################
# Security
###############################################################################

# Production should use password authentication
# Configure through Docker Secret or Environment Variable

# requirepass CHANGE_ME



###############################################################################
# Performance
###############################################################################

databases 16


tcp-backlog 511



###############################################################################
# Slow Log Monitoring
###############################################################################

slowlog-log-slower-than 10000


slowlog-max-len 128



###############################################################################
# Health Monitoring
###############################################################################

latency-monitor-threshold 100