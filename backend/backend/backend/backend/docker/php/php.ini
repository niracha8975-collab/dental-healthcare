###############################################################################
# Dental Healthcare Management System
# PHP 8.3 Runtime Configuration
# Laravel 12 Production Foundation
###############################################################################


###############################################################################
# Language / Encoding
###############################################################################

default_charset = "UTF-8"


mbstring.language = Thai



###############################################################################
# Timezone
###############################################################################

date.timezone = Asia/Bangkok



###############################################################################
# Memory
###############################################################################

memory_limit = 512M



###############################################################################
# Execution
###############################################################################

max_execution_time = 120


max_input_time = 120



###############################################################################
# Input
###############################################################################

max_input_vars = 5000



###############################################################################
# Upload
###############################################################################

file_uploads = On


upload_max_filesize = 25M


post_max_size = 30M


max_file_uploads = 50



###############################################################################
# Error Handling
###############################################################################

display_errors = Off


display_startup_errors = Off


log_errors = On


error_log = /var/log/php/error.log


error_reporting = E_ALL



###############################################################################
# Security
###############################################################################

expose_php = Off


allow_url_fopen = On


allow_url_include = Off



###############################################################################
# Session
###############################################################################

session.save_handler = redis


session.gc_maxlifetime = 7200



###############################################################################
# OPcache Reference
###############################################################################

opcache.enable = 1



###############################################################################
# Realpath Cache
###############################################################################

realpath_cache_size = 4096K


realpath_cache_ttl = 600



###############################################################################
# File Information
###############################################################################

variables_order = "GPCS"


request_order = "GP"



###############################################################################
# Resource Protection
###############################################################################

max_input_nesting_level = 128